# Desarrollo local: el repo se monta en caliente sobre el docroot del contenedor.
# Uso: docker compose up -d   →   http://localhost:8080
# Producción usa docker-compose.prod.yml (código copiado en la imagen, sin montaje).

services:
  portal-micronuba:
    build: .
    container_name: PortalMicronuba
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
