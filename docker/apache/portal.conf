# Configuración de Apache del portal. Se instala como zz-portal.conf para cargarse
# DESPUÉS de security.conf de la imagen, que si no sobrescribe ServerTokens.

# No anunciar versiones ni módulos
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Pocos procesos: el portal es liviano y comparte el VPS con otros proyectos
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       15
    MaxConnectionsPerChild 1000
</IfModule>

# Lo interno responde 404 (no 403, para no confirmar que existe). La mayoría ya
# no está en la imagen por el .dockerignore; esto cubre el montaje de desarrollo
# y lo que sí se copia pero no es público (config/, lib/).
RedirectMatch 404 "^/(config|lib|logs|tests|doc|docker|node_modules|release)(/|$)"
RedirectMatch 404 "/\."
RedirectMatch 404 "\.(md|ya?ml|sh|json|lock|dist)$"

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On

    # www → dominio principal
    RewriteCond %{HTTP_HOST} ^www\.micronuba\.net$ [NC]
    RewriteRule ^(.*)$ https://micronuba.net/$1 [R=301,L]

    # Rutas del hosting anterior: conserva enlaces viejos, Google y vistas previas en redes
    RewriteRule ^sitepro/portal_web_micronuba/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
